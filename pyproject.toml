[project]
name = "franken-stack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "confluent-kafka==2.16.1",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "pika==1.3.2",
    "psycopg[binary]==3.3.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.48",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["ruff==0.17.6"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
