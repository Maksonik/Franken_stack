services:
  db:
    image: postgres:18-alpine
    environment: &postgres_env
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.template to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    image: franken-stack-lab:local
    build: .
    environment: &database_env
      <<: *postgres_env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: &http_healthcheck
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: franken-stack-lab:local
    pull_policy: never
    environment: *database_env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  partner:
    image: franken-stack-lab:local
    pull_policy: never
    environment: *database_env
    depends_on:
      - api
    command: ["uvicorn", "app.partner:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck: *http_healthcheck

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment: &rabbitmq_env
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-lab}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  outbox-publisher:
    image: franken-stack-lab:local
    pull_policy: never
    environment:
      <<: [*database_env, *rabbitmq_env]
      RABBITMQ_HOST: rabbitmq
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.workers.outbox_publisher"]
    restart: unless-stopped

  delivery-worker:
    image: franken-stack-lab:local
    pull_policy: never
    environment:
      <<: *rabbitmq_env
      RABBITMQ_HOST: rabbitmq
      PARTNER_WEBHOOK_URL: ${PARTNER_WEBHOOK_URL:-http://partner:8000/webhooks/payments}
    depends_on:
      partner:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.workers.webhook_delivery"]
    restart: unless-stopped

  kafka:
    image: &kafka_image apache/kafka:4.1.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s

  kafka-init:
    image: *kafka_image
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - payment-events
      - --partitions
      - "3"
      - --replication-factor
      - "1"
      - --config
      - retention.ms=604800000

  kafka-publisher:
    image: franken-stack-lab:local
    pull_policy: never
    environment: &kafka_env
      <<: *database_env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: &kafka_worker_dependencies
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.kafka_publisher"]
    restart: unless-stopped

  kafka-analytics:
    image: franken-stack-lab:local
    pull_policy: never
    environment:
      <<: *kafka_env
      KAFKA_CONSUMER_GROUP: analytics
    depends_on: *kafka_worker_dependencies
    command: ["python", "-m", "app.workers.kafka_consumer"]
    restart: unless-stopped

  kafka-audit:
    image: franken-stack-lab:local
    pull_policy: never
    environment:
      <<: *kafka_env
      KAFKA_CONSUMER_GROUP: audit
    depends_on: *kafka_worker_dependencies
    command: ["python", "-m", "app.workers.kafka_consumer"]
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    environment:
      KAFKA_CLUSTERS_0_NAME: franken-stack
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "true"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
  kafka_data:
